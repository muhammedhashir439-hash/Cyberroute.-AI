<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRoute AI - Math Fair Edition</title>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            color: var(--text-dim);
            margin: 5px 0 0 0;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .view-section { display: none; width: 100%; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .view-section.active { display: flex; }

        /* Original Laptop Layout Styling */
        #laptop-view {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }

        .qr-section-title {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .qr-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .mini-qrcode {
            background: white;
            padding: 4px;
            border-radius: 4px;
        }

        canvas {
            background-color: #020617;
            border: 2px solid var(--border);
            border-radius: 8px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .leaderboard-list li:last-child { border-bottom: none; }

        /* Phone Controller View Styling */
        .controller-card {
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .level-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>CyberRoute AI</h1>
        <p>Master Dijkstra's Algorithm for the Math Fair!</p>
    </header>

    <!-- LAPTOP DISPLAY VIEW (Original Style + 4 Level QR Codes) -->
    <div id="laptop-view" class="view-section active">
        
        <!-- Left Sidebar with 4 QR Codes -->
        <div class="sidebar">
            <div class="card">
                <div class="qr-section-title">📱 Phone Controllers (Scan Level)</div>
                
                <div class="qr-row">
                    <span style="font-size: 0.85rem; font-weight: bold;">Level 1</span>
                    <div class="mini-qrcode" id="qrcode-lvl1"></div>
                </div>
                <div class="qr-row">
                    <span style="font-size: 0.85rem; font-weight: bold;">Level 2</span>
                    <div class="mini-qrcode" id="qrcode-lvl2"></div>
                </div>
                <div class="qr-row">
                    <span style="font-size: 0.85rem; font-weight: bold;">Level 3</span>
                    <div class="mini-qrcode" id="qrcode-lvl3"></div>
                </div>
                <div class="qr-row">
                    <span style="font-size: 0.85rem; font-weight: bold;">Level 4</span>
                    <div class="mini-qrcode" id="qrcode-lvl4"></div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 1.1rem;">🏆 Leaderboard</h3>
                <ul class="leaderboard-list" id="leaderboardList">
                    <li><span>No scores yet</span><span>-</span></li>
                </ul>
            </div>
        </div>

        <!-- Central Game Canvas Area -->
        <div class="card" id="game-area" style="display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 320px;">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; font-weight: bold;">
                <span id="displayPlayer">Player: Waiting for phone scan...</span>
                <span id="displayScore">Score: 0</span>
            </div>
            <canvas id="gameCanvas" width="420" height="380"></canvas>
        </div>

    </div>

    <!-- PHONE CONTROLLER VIEW (Optimized Mobile Interface) -->
    <div id="controller-view" class="view-section">
        <div class="card controller-card">
            <h3 style="color: var(--accent); margin-top: 0;">🎮 Game Controller</h3>
            <div class="level-badge" id="phoneLevelDisplay">Level: Loading...</div>
            <div class="input-group">
                <label for="phonePlayerName">Your Name / Team Name</label>
                <input type="text" id="phonePlayerName" placeholder="Enter name...">
            </div>
            <button class="btn" id="phoneStartBtn">Connect to Laptop</button>
            <div id="controllerStatus" style="margin-top: 15px; color: var(--accent); font-size: 0.9rem;"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isController = window.location.hash.includes('controller');
        const levelParam = urlParams.get('lvl') || '1';

        const laptopView = document.getElementById('laptop-view');
        const controllerView = document.getElementById('controller-view');

        if (isController) {
            // --- PHONE CONTROLLER MODE ---
            laptopView.classList.remove('active');
            controllerView.classList.add('active');

            const levelNames = {
                '1': 'Level 1: Novice',
                '2': 'Level 2: Intermediate',
                '3': 'Level 3: Advanced',
                '4': 'Level 4: Expert'
            };
            document.getElementById('phoneLevelDisplay').textContent = levelNames[levelParam] || 'Level 1';

            document.getElementById('phoneStartBtn').addEventListener('click', () => {
                const name = document.getElementById('phonePlayerName').value.trim();
                if (!name) {
                    alert("Please enter your name!");
                    return;
                }

                const sessionPayload = {
                    player: name,
                    level: levelParam,
                    timestamp: Date.now()
                };

                localStorage.setItem('cyberroute_active_session', JSON.stringify(sessionPayload));
                document.getElementById('controllerStatus').textContent = "Connected! Check your laptop screen.";
            });

        } else {
            // --- LAPTOP DISPLAY MODE ---
            laptopView.classList.add('active');
            controllerView.classList.remove('active');

            const baseUrl = window.location.href.split('#')[0].split('?')[0];

            // Generate the 4 mini QR codes on the sidebar
            for (let i = 1; i <= 4; i++) {
                const targetUrl = `${baseUrl}?lvl=${i}#controller`;
                const container = document.getElementById(`qrcode-lvl${i}`);
                if (container) {
                    container.innerHTML = "";
                    new QRCode(container, {
                        text: targetUrl,
                        width: 75,
                        height: 75,
                    });
                }
            }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let activePlayer = "";
            let currentLevel = "1";
            let score = 0;

            renderLeaderboard();
            drawIdleCanvas();

            // Listen for phone controller sync events
            window.addEventListener('storage', (e) => {
                if (e.key === 'cyberroute_active_session') {
                    const data = JSON.parse(e.newValue);
                    if (data && data.player) {
                        activePlayer = data.player;
                        currentLevel = data.level;
                        score = parseInt(currentLevel) * 100;

                        document.getElementById('displayPlayer').textContent = `Player: ${activePlayer} (Lvl ${currentLevel})`;
                        document.getElementById('displayScore').textContent = `Score: ${score}`;
                        drawGameCanvas(currentLevel);
                    }
                }
            });

            function drawIdleCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText("Scan any Level QR code on the left", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillText("with your phone to start playing!", canvas.width / 2, canvas.height / 2 + 20);
            }

            function drawGameCanvas(lvl) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 14px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(`Level ${lvl} Active! Tap canvas nodes to score points.`, canvas.width / 2, 30);

                const nodes = [
                    {x: 80, y: 150, label: 'A'},
                    {x: 210, y: 100, label: 'B'},
                    {x: 210, y: 260, label: 'C'},
                    {x: 340, y: 180, label: 'D'}
                ];

                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(80, 150); ctx.lineTo(210, 100);
                ctx.moveTo(80, 150); ctx.lineTo(210, 260);
                ctx.moveTo(210, 100); ctx.lineTo(340, 180);
                ctx.moveTo(210, 260); ctx.lineTo(340, 180);
                ctx.stroke();

                nodes.forEach(n => {
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#38bdf8';
                    ctx.stroke();

                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 14px Segoe UI';
                    ctx.fillText(n.label, n.x, n.y);
                });
            }

            canvas.addEventListener('click', () => {
                if (!activePlayer) return;
                score += 50;
                document.getElementById('displayScore').textContent = `Score: ${score}`;
                saveScore(activePlayer, score, currentLevel);
                renderLeaderboard();
            });

            function saveScore(name, finalScore, lvl) {
                let lb = JSON.parse(localStorage.getItem('cyberroute_lb') || '[]');
                lb.push({ name, score: finalScore, level: lvl });
                lb.sort((a, b) => b.score - a.score);
                lb = lb.slice(0, 5);
                localStorage.setItem('cyberroute_lb', JSON.stringify(lb));
            }

            function renderLeaderboard() {
                const lb = JSON.parse(localStorage.getItem('cyberroute_lb') || '[]');
                const list = document.getElementById('leaderboardList');
                if (lb.length === 0) {
                    list.innerHTML = '<li><span>No scores yet</span><span>-</span></li>';
                    return;
                }
                list.innerHTML = '';
                lb.forEach((entry, idx) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${idx + 1}. ${entry.name} <small style="color:var(--text-dim);">(Lvl ${entry.level || '1'})</small></span><strong>${entry.score} pts</strong>`;
                    list.appendChild(li);
                });
            }
        }
    </script>
</body>
</html>
